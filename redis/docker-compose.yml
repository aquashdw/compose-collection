services:
  redis:
    image: redis:8.2
    container_name: redis-compose
    restart: always
    environment:
      - REDIS_SYSTEMPASS=${REDIS_SYSTEMPASS}
    volumes:
      - "$DOCKER_VOLUME_ROOT/redis/redis-data:/data"
      - "$DOCKER_VOLUME_ROOT/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro"
    ports:
      - 6379:6379
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
